[workspace]
members = [
    "crates/kubeweft-model",
    "crates/kubeweft-capability",
    "crates/kubeweft-identity",
    "crates/kubeweft-policy",
    "crates/kubeweft-scheduler",
    "crates/kubeweft-planner",
    "crates/kubeweft-agent-core",
    "crates/kubeweft-filesystem",
    "crates/kubeweft-local",
    "crates/kubeweft-plugin-sdk",
    "crates/kubeweft-protocol",
    "apps/cli",
    "apps/desktop/bridge",
    "agents/linux",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
