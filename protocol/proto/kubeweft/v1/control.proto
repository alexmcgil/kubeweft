syntax = "proto3";

package kubeweft.v1;

import "kubeweft/v1/device.proto";
import "kubeweft/v1/job.proto";
import "kubeweft/v1/cluster.proto";
import "kubeweft/v1/common.proto";

// Field numbers are part of the wire contract. Removed field numbers must be
// reserved and never reused.
//
// These are semantic envelopes only; no transport or RPC service is defined.
message AdvertiseDeviceRequest {
  Device device = 1;
}

message AdvertiseDeviceResponse {
  Device device = 1;
}

message SubmitJobRequest {
  Job job = 1;
}

message SubmitJobResponse {
  Job job = 1;
}

message CreateClusterRequest {
  string name = 1;
}

message CreateClusterResponse {
  Cluster cluster = 1;
  string invite_token = 2;
}

message JoinClusterRequest {
  string coordinator_endpoint = 1;
  string invite_token = 2;
}

message JoinClusterResponse {
  Cluster cluster = 1;
}

// Peer-side idempotent join transaction. Retrying the same request id for the
// same device returns the originally issued membership credential.
message AcceptClusterJoinRequest {
  string invite_token = 1;
  ClusterMember member = 2;
  JoinRequestId join_request_id = 3;
}

message AcceptClusterJoinResponse {
  Cluster cluster = 1;
  string membership_credential = 2;
  repeated ClusterMember members = 3 [deprecated = true];
  repeated AuthorizedClusterMember authorized_members = 4;
}

// The digest lets members validate a presented high-entropy credential without
// distributing the bearer credential itself.
message AuthorizedClusterMember {
  ClusterMember member = 1;
  bytes membership_credential_sha256 = 2;
}

message PeerAuthorization {
  ClusterId cluster_id = 1;
  DeviceId device_id = 2;
  string membership_credential = 3;
}

message ListClusterMembersRequest {
  ClusterId cluster_id = 1;
}

message ListClusterMembersResponse {
  Cluster cluster = 1;
  repeated ClusterMember members = 2;
}

message ListRemoteClusterMembersRequest {
  ClusterId cluster_id = 1 [deprecated = true];
  DeviceId device_id = 2 [deprecated = true];
  string membership_credential = 3 [deprecated = true];
  PeerAuthorization authorization = 4;
}

message ListRemoteClusterMembersResponse {
  Cluster cluster = 1;
  repeated AuthorizedClusterMember members = 2;
}

enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_UNKNOWN = 1;
  PRESENCE_STATE_ONLINE = 2;
  PRESENCE_STATE_OFFLINE = 3;
}

message PresenceRecord {
  ClusterMember member = 1;
  PresenceState state = 2;
  optional uint64 observed_at_millis = 3;
}

message ProbePresenceRequest {
  PeerAuthorization authorization = 1;
}

message ProbePresenceResponse {
}

message LocalPresenceRequest {
}

message LocalPresenceResponse {
  repeated PresenceRecord records = 1;
}
